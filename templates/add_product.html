<!DOCTYPE html>
<html>
<head>
    <title>Добавить товар</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #7FFF00;
            padding: 20px;
        }
        .container {
            background-color: #FFFFFF;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
        }
        h1 { text-align: center; margin-bottom: 20px; }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Times New Roman', Times, serif;
        }
        button {
            background-color: #00FA9A;
            color: #333;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            width: 100%;
        }
        .cancel {
            background-color: #ccc;
            text-align: center;
            display: block;
            padding: 12px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Добавить товар</h1>
        <form method="POST">
            <label>Название:</label>
            <input type="text" name="name" required>
            
            <label>Бренд:</label>
            <input type="text" name="brand" required>
            
            <label>Размер (S, M, L, XL, 32/32, 40...):</label>
            <input type="text" name="size" required>
            
            <label>Цвет:</label>
            <input type="text" name="color" required>
            
            <label>Цена (₽):</label>
            <input type="number" step="0.01" name="price" required>
            
            <label>Количество:</label>
            <input type="number" name="stock" required>
            
            <label>Категория:</label>
            <select name="category">
                <option value="футболки">Футболки</option>
                <option value="джинсы">Джинсы</option>
                <option value="платья">Платья</option>
                <option value="куртки">Куртки</option>
                <option value="свитеры">Свитеры</option>
                <option value="шорты">Шорты</option>
                <option value="рубашки">Рубашки</option>
                <option value="пальто">Пальто</option>
            </select>
            
            <label>Материал:</label>
            <select name="material">
                <option value="хлопок">Хлопок</option>
                <option value="деним">Деним</option>
                <option value="шерсть">Шерсть</option>
                <option value="кожа">Кожа</option>
                <option value="полиэстер">Полиэстер</option>
            </select>
            
            <label>Сезон:</label>
            <select name="season">
                <option value="лето">Лето</option>
                <option value="зима">Зима</option>
                <option value="весна">Весна</option>
                <option value="осень">Осень</option>
                <option value="всесезон">Всесезон</option>
            </select>
            
            <button type="submit">💾 Сохранить</button>
            <a href="/admin/products" class="cancel">❌ Отмена</a>
        </form>
    </div>
</body>
</html>
