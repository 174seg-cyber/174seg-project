<!DOCTYPE html>
<html>
<head>
    <title>Гость - Каталог одежды</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #7FFF00;
            padding: 20px;
        }
        .header {
            background-color: #FFFFFF;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header a {
            color: #0066cc;
            text-decoration: none;
            margin-left: 20px;
        }
        .container {
            background-color: #FFFFFF;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
        }
        h1 { margin-bottom: 20px; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #7FFF00;
            font-weight: bold;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span style="font-weight: bold;">👤 Гостевой режим</span>
        <a href="/login">Войти</a>
    </div>
    <div class="container">
        <h1>👕 Каталог одежды</h1>
        <table>
            <thead>
                <tr><th>Название</th><th>Бренд</th><th>Размер</th><th>Цвет</th><th>Цена</th><th>Наличие</th></tr>
            </thead>
            <tbody>
                {% for p in products %}
                <tr>
                    <td>{{ p.name }}</td>
                    <td>{{ p.brand }}</td>
                    <td>{{ p.size }}</td>
                    <td>{{ p.color }}</td>
                    <td>{{ p.price }} ₽</td>
                    <td>{{ p.stock }} шт.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="footer">ООО «Одежда» - качественная одежда для всей семьи</div>
</body>
</html>
